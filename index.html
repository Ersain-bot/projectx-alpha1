<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Главная</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
--bg-color: #f2f2f7;
--header-bg: rgba(255, 255, 255, 0.92);
--accent-color: #007AFF;
--border-color: #d1d1d6;
--card-bg: #ffffff;
--text-color: #000000;
--secondary-text: #8e8e93;
--segmented-bg: #e3e3e9;
--header-height: 50px;
        }
body.dark-mode {
--bg-color: #1c1c1e;
--header-bg: rgba(28, 28, 30, 0.95);
--border-color: #38383a;
--card-bg: #2c2c2e;
--text-color: #ffffff;
--secondary-text: #aeaeae;
--segmented-bg: #3a3a3c;
        }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: var(--bg-color);
color: var(--text-color);
transition: background 0.4s ease, color 0.4s ease;
min-height: 100vh;
display: flex;
flex-direction: column;
        }
/* === УЛУЧШЕННАЯ ШАПКА (как в Планах) === */
.top-bar {
position: fixed;
top: 0; left: 0; width: 100%;
height: calc(var(--header-height) + env(safe-area-inset-top));
background-color: var(--header-bg);
backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
border-bottom: 0.5px solid var(--border-color);
display: flex; z-index: 1000;
        }
.header-content {
width: 100%; padding-top: env(safe-area-inset-top);
padding-left: 16px; padding-right: 16px;
display: flex; align-items: center; justify-content: space-between;
        }
.nav-btn {
background: none; border: none; color: var(--accent-color);
font-size: 17px; font-weight: 600; cursor: pointer; padding: 8px 0;
        }
.header-title {
font-size: 20px; font-weight: 700; text-align: center; flex: 1;
letter-spacing: -0.5px;
        }
/* === УЛУЧШЕННЫЙ ГЛАВНЫЙ ЭКРАН === */
.main-container {
flex: 1;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 20px;
margin-top: calc(var(--header-height) + env(safe-area-inset-top));
gap: 24px;
        }
.menu-card {
width: 100%;
max-width: 340px;
padding: 22px 20px;
background: var(--card-bg);
color: var(--text-color);
border-radius: 20px;
box-shadow: 0 8px 24px rgba(0,0,0,0.08);
display: flex;
align-items: center;
gap: 16px;
font-size: 19px;
font-weight: 600;
text-decoration: none;
transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
.menu-card:hover { transform: translateY(-3px); }
.menu-card:active { transform: scale(0.96); }
.menu-card .icon {
font-size: 28px;
width: 42px;
        }
.menu-card.dark-mode .icon { filter: brightness(1.1); }
/* Боковое меню (улучшенный дизайн) */
.sidebar {
position: fixed;
top: 0; left: -280px;
width: 280px; height: 100%;
background: var(--card-bg);
box-shadow: 8px 0 30px rgba(0,0,0,0.15);
transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
z-index: 2000;
padding-top: env(safe-area-inset-top);
        }
.sidebar.active { transform: translateX(280px); }
.sidebar-title {
padding: 24px 20px 18px;
font-size: 24px; font-weight: 700;
color: var(--text-color);
        }
.settings-group { padding: 0 20px; margin-bottom: 28px; }
.settings-group label {
display: block; font-size: 13px; color: var(--secondary-text);
text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.6px;
        }
.segmented-control {
display: flex; background: var(--segmented-bg);
padding: 3px; border-radius: 12px; gap: 3px;
        }
.segment {
flex: 1; padding: 12px 0; font-size: 15px; font-weight: 600;
text-align: center; border-radius: 9px; cursor: pointer;
transition: all 0.2s ease;
        }
.segment.active {
background: var(--card-bg); box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
.dark-mode .segment.active { background: #636366; color: white; }
.overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.45); display: none;
z-index: 1500; backdrop-filter: blur(4px);
        }
.overlay.active { display: block; }
</style>
</head>
<body>
<header class="top-bar">
<div class="header-content">
<button class="nav-btn" id="btn-settings" onclick="toggleMenu()">Баптаулар</button>
<div class="header-title" id="main-title">Главная</div>
</div>
</header>

<main class="main-container">
    <!-- УЛУЧШЕННЫЕ КАРТОЧКИ С ИКОНКАМИ -->
    <a href="zametki.html" class="menu-card" id="link-page1">
        <span class="icon">📝</span>
        <span id="page1-text">Заметки</span>
    </a>
    
    <a href="page2.html" class="menu-card" id="link-page2">
        <span class="icon">📅</span>
        <span id="page2-text">Апталық жоспар</span>
    </a>
</main>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav class="sidebar" id="sidebar">
<div class="sidebar-title" id="side-title">Баптаулар</div>
<div class="settings-group">
<label id="label-theme">Тақырып</label>
<div class="segmented-control" id="theme-ctrl">
<div class="segment" data-value="light" onclick="setTheme('light')">Жарық</div>
<div class="segment" data-value="system" onclick="setTheme('system')">Жүйе</div>
<div class="segment" data-value="dark" onclick="setTheme('dark')">Қараңғы</div>
</div>
</div>
<div class="settings-group">
<label id="label-lang">Тіл</label>
<div class="segmented-control" id="lang-ctrl">
<div class="segment" data-value="ru" onclick="setLang('ru')">RU</div>
<div class="segment" data-value="kz" onclick="setLang('kz')">KZ</div>
<div class="segment" data-value="en" onclick="setLang('en')">EN</div>
</div>
</div>
</nav>

<script>
// === СЛОВАРЬ С НОВЫМИ НАЗВАНИЯМИ ===
const translations = {
ru: {
title: "Главная",
settings: "Настройки",
page1: "Заметки",
page2: "Планы",
theme: "Тема",
lang: "Язык",
light: "Светлая",
system: "Система",
dark: "Темная"
},
kz: {
title: "Басты бет",
settings: "Баптаулар",
page1: "Заметки",
page2: "Апталық жоспар",
theme: "Тақырып",
lang: "Тіл",
light: "Жарық",
system: "Жүйе",
dark: "Қараңғы"
},
en: {
title: "Home",
settings: "Settings",
page1: "Notes",
page2: "Weekly Plan",
theme: "Theme",
lang: "Language",
light: "Light",
system: "System",
dark: "Dark"
}
};

function toggleMenu() {
document.getElementById('sidebar').classList.toggle('active');
document.getElementById('overlay').classList.toggle('active');
}

function setTheme(mode) {
localStorage.setItem('theme', mode);
const body = document.body;
document.querySelectorAll('#theme-ctrl .segment').forEach(s => {
s.classList.toggle('active', s.getAttribute('data-value') === mode);
});
if (mode === 'dark') body.classList.add('dark-mode');
else if (mode === 'light') body.classList.remove('dark-mode');
else {
const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
body.classList.toggle('dark-mode', isDark);
}
}

function setLang(lang) {
localStorage.setItem('lang', lang);
document.querySelectorAll('#lang-ctrl .segment').forEach(s => {
s.classList.toggle('active', s.getAttribute('data-value') === lang);
});
const t = translations[lang];

document.getElementById('btn-settings').innerText = t.settings;
document.getElementById('main-title').innerText = t.title;
document.getElementById('side-title').innerText = t.settings;
document.getElementById('page1-text').innerText = t.page1;
document.getElementById('page2-text').innerText = t.page2;
document.getElementById('label-theme').innerText = t.theme;
document.getElementById('label-lang').innerText = t.lang;

// Обновляем сегменты темы
const themeSegments = document.querySelectorAll('#theme-ctrl .segment');
themeSegments[0].innerText = t.light;
themeSegments[1].innerText = t.system;
themeSegments[2].innerText = t.dark;
}

window.onload = () => {
const savedTheme = localStorage.getItem('theme') || 'system';
const savedLang = localStorage.getItem('lang') || 'kz';
setTheme(savedTheme);
setLang(savedLang);
};

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
if (localStorage.getItem('theme') === 'system') {
document.body.classList.toggle('dark-mode', e.matches);
}
});
</script>
</body>
</html>
